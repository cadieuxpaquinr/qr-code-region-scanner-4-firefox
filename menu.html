<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 0; width: 220px; }
    button { display: block; width: 100%; box-sizing: border-box; padding: 10px 14px;
      border: 0; background: none; font: inherit; color: inherit; text-align: left;
      cursor: pointer; }
    button:hover, button:focus { background: var(--accent); color: var(--accent-fg);
      outline: none; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  </style>
</head>
<body>
  <button id="scan">Scan a region</button>
  <hr>
  <button id="settings">Settings</button>
  <script src="menu.js"></script>
</body>
</html>
